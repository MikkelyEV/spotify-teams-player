<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOTD</title><script src="https://res.cdn.office.net/teams-js/2.34.0/js/MicrosoftTeams.min.js"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:15px Segoe UI,Arial}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:0;padding:12px;border-radius:9px;border:1px solid #555;background:#292929;color:#fff}button{padding:12px 16px;border:0;border-radius:9px;background:#1db954;color:#07140b;font-weight:700;cursor:pointer}button.secondary{background:#333;color:#fff}.error{color:#ffb4ab;min-height:20px;margin-top:8px}#list{display:flex;flex-direction:column;gap:16px}.song{border-top:1px solid #333;padding-top:12px}.song:first-child{border-top:0;padding-top:0}.meta{color:#bbb;font-size:13px;margin:4px 0 8px}iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none}.modal .card{max-width:420px;margin:0}.modal .row{justify-content:flex-end;margin-top:16px}</style></head><body><main class="wrap"><section class="card"><div class="row"><input id="url" aria-label="Enlace de Spotify"><button id="add">Agregar canción</button></div><div id="status" class="error"></div></section><section class="card"><h2 style="margin-top:0">Song Of The Day</h2><div id="list"></div></section></main><div id="confirm" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirmText"><div class="card"><div id="confirmText">Ya agregaste una canción hoy. ¿Quieres cambiarla por esta canción?</div><div class="row"><button id="cancel" class="secondary">Cancelar</button><button id="replace">Cambiar canción</button></div></div></div><script>
let me={id:'',name:''}; const api='/api/songs'; let pending=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function identity(){try{await microsoftTeams.app.initialize();const c=await microsoftTeams.app.getContext();me.id=c.user?.id||c.user?.loginHint||'';me.name=c.user?.displayName||c.user?.loginHint||'Usuario de Teams';}catch{me.id=localStorage.getItem('sotd-demo-id')||crypto.randomUUID();localStorage.setItem('sotd-demo-id',me.id);me.name='Usuario web';}}
function spotifyId(v){try{const u=new URL(v.trim());const m=u.hostname==='open.spotify.com'&&u.pathname.match(/^\/(?:intl-[a-z-]+\/)?track\/([A-Za-z0-9]{22})/);return m&&m[1]}catch{return null}}
function songNode(x){const d=document.createElement('div');d.className='song';d.dataset.key=x.trackId+'|'+x.createdUtc;d.innerHTML=`<div><strong>${esc(x.trackTitle||'Canción de Spotify')}</strong>${x.artistName?' - '+esc(x.artistName):''}</div><div class="meta">Agregada por ${esc(x.userName)} · ${esc(x.centralTime)}</div><iframe loading="lazy" title="${esc(x.trackTitle||'Spotify')}" src="https://open.spotify.com/embed/track/${encodeURIComponent(x.trackId)}?utm_source=generator" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;return d}
async function load(){const r=await fetch(api,{cache:'no-store'});if(!r.ok)return;const d=await r.json();const el=document.querySelector('#list');const items=d.items||[];const keys=new Set(items.map(x=>x.trackId+'|'+x.createdUtc));
// Keep existing preview iframes in place (moving or recreating them would stop playback).
for(const n of [...el.children])if(!keys.has(n.dataset.key))n.remove();let prev=null;for(const x of items){const k=x.trackId+'|'+x.createdUtc;let n=[...el.children].find(c=>c.dataset.key===k);if(!n){n=songNode(x);el.insertBefore(n,prev?prev.nextSibling:el.firstChild)}prev=n}}
async function submit(trackId,replace){const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({trackId,userId:me.id,userName:me.name,replace})});let d={};try{d=await r.json()}catch{}return{r,d}}
async function add(){const trackId=spotifyId(document.querySelector('#url').value);const s=document.querySelector('#status');if(!trackId){s.textContent='Pega un enlace válido de una canción de Spotify.';return}s.textContent='';const{r,d}=await submit(trackId,false);if(r.status===409&&d.code==='ALREADY_SUBMITTED'){pending=trackId;document.querySelector('#confirm').hidden=false;document.querySelector('#replace').focus();return}if(!r.ok){s.textContent=d.error||'No se pudo agregar la canción.';return}document.querySelector('#url').value='';await load()}
function closeConfirm(){pending=null;document.querySelector('#confirm').hidden=true}
async function replaceSong(){const trackId=pending;closeConfirm();if(!trackId)return;const s=document.querySelector('#status');const{r,d}=await submit(trackId,true);if(!r.ok){s.textContent=d.error||'No se pudo cambiar la canción.';return}document.querySelector('#url').value='';await load()}
document.querySelector('#add').onclick=add;document.querySelector('#cancel').onclick=closeConfirm;document.querySelector('#replace').onclick=replaceSong;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#confirm').hidden)closeConfirm()});identity().then(load);setInterval(load,30000);
</script></body></html>
