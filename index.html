<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOTD</title><script src="https://res.cdn.office.net/teams-js/2.34.0/js/MicrosoftTeams.min.js"></script><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:15px Segoe UI,Arial}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#1c1c1c;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:260px;padding:12px;border-radius:9px;border:1px solid #555;background:#292929;color:#fff}button{padding:12px 16px;border:0;border-radius:9px;background:#1db954;color:#07140b;font-weight:700;cursor:pointer}button.secondary{background:#333;color:#fff}.muted{color:#bbb;font-size:13px}.error{color:#ffb4ab;min-height:20px;margin-top:8px}.song{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:1px solid #333}.meta{color:#bbb;font-size:13px;margin-top:4px}iframe{width:100%;height:352px;border:0;border-radius:12px}.empty{text-align:center;color:#aaa;padding:24px}</style></head><body><main class="wrap"><section class="card"><h2 style="margin-top:0">SOTD</h2><p class="muted">Una canción por persona. La lista se reinicia diariamente a las 12:00 a. m. Central Time.</p><div class="row"><input id="url" placeholder="Pega un enlace de canción de Spotify"><button id="add">Agregar canción</button><button id="refresh" class="secondary">Actualizar</button></div><div id="status" class="error"></div></section><section id="playerCard" class="card" hidden><iframe id="player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></section><section class="card"><div id="list" class="empty">Cargando…</div></section></main><script>
let me={id:'',name:''}; const api='/api/songs';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function identity(){try{await microsoftTeams.app.initialize();const c=await microsoftTeams.app.getContext();me.id=c.user?.id||c.user?.loginHint||'';me.name=c.user?.displayName||c.user?.loginHint||'Usuario de Teams';}catch{me.id=localStorage.getItem('sotd-demo-id')||crypto.randomUUID();localStorage.setItem('sotd-demo-id',me.id);me.name='Usuario web';}}
function spotifyId(v){try{const u=new URL(v.trim());const m=u.hostname==='open.spotify.com'&&u.pathname.match(/^\/track\/([A-Za-z0-9]+)/);return m&&m[1]}catch{return null}}
function play(id){document.querySelector('#playerCard').hidden=false;document.querySelector('#player').src='https://open.spotify.com/embed/track/'+encodeURIComponent(id)+'?utm_source=generator'}
async function load(){const r=await fetch(api);const d=await r.json();const el=document.querySelector('#list');if(!d.items?.length){el.className='empty';el.textContent='Aún no hay canciones para hoy.';return}el.className='';el.innerHTML=d.items.map((x,i)=>`<div class="song"><div><strong>${i+1}. ${esc(x.trackId)}</strong><div class="meta">Agregada por ${esc(x.userName)} a las ${esc(x.centralTime)} Central Time</div></div><button onclick="play('${x.trackId}')">Play</button></div>`).join('');}
async function add(){const trackId=spotifyId(document.querySelector('#url').value);const s=document.querySelector('#status');if(!trackId){s.textContent='Pega un enlace válido de una canción de Spotify.';return}s.textContent='';const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({trackId,userId:me.id,userName:me.name})});const d=await r.json();if(!r.ok){s.textContent=d.error||'No se pudo agregar la canción.';return}document.querySelector('#url').value='';play(trackId);await load()}
document.querySelector('#add').onclick=add;document.querySelector('#refresh').onclick=load;identity().then(load);setInterval(load,30000);
</script></body></html>
