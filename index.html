<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOTD</title>
  <script src="https://res.cdn.office.net/teams-js/2.30.0/js/MicrosoftTeams.min.js"></script>
  <style>
    :root{color-scheme:light dark;font-family:Segoe UI,Arial,sans-serif;background:#f5f5f5;color:#242424}
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f5f5;color:#242424}main{max-width:900px;margin:auto}
    h1{font-size:24px;margin:0 0 16px}.add-row{display:flex;gap:8px;margin-bottom:8px}.add-row input{flex:1;min-width:0;padding:10px;border:1px solid #aaa;border-radius:6px;background:white;color:#242424}.primary{padding:10px 14px;border:0;border-radius:6px;background:#5b5fc7;color:white;font-weight:600;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}#status{min-height:22px;margin:4px 0 12px;color:#a4262c}.song{background:white;border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0;box-shadow:0 1px 3px #0001}.song-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px}.song-info{display:flex;align-items:flex-start;gap:12px;min-width:0;flex:1}.song-info>div{min-width:0;padding-top:2px}.rank{flex:none;min-width:1.4em;font-size:36px;line-height:1;font-weight:800;letter-spacing:-1px;text-align:center}.rank-1{color:#FFD54A}.rank-2{color:#B9C2CC}.rank-3{color:#D98A4E}.rank-4{color:#8B7CFF}.rank-5{color:#36C5F0}.rank-6{color:#34D399}.rank-7{color:#FF6B9E}.rank-8{color:#FF7043}.rank-other{color:#8A8886}.owner{font-size:15px;font-weight:650;line-height:1.25}.track-meta{font-size:13px;color:#616161;margin-top:3px;overflow:hidden;text-overflow:ellipsis}.rating-control{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:5px;max-width:430px}.stars{display:inline-flex;gap:1px}.star{appearance:none;border:0;background:transparent;color:#8a8886;font-size:25px;line-height:1;padding:0 1px;cursor:pointer;border-radius:4px}.star.filled{color:#d79b00}.star:hover,.star:focus-visible{color:#f0b400;background:#fff4ce;outline:2px solid #5b5fc7;outline-offset:1px}.summary{font-size:13px;white-space:nowrap}.current-rating{width:100%;font-size:12px;color:#616161;text-align:right;min-height:15px}.spotify{width:100%;height:152px;border:0;border-radius:8px;display:block}.empty{color:#616161;text-align:center;padding:24px}.dialog-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.dialog-backdrop[hidden]{display:none}.dialog{background:white;color:#242424;border-radius:10px;padding:20px;max-width:440px;box-shadow:0 8px 32px #0005}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{padding:9px 13px;border:1px solid #888;border-radius:6px;background:white;color:#242424;cursor:pointer}
    @media(max-width:620px){body{padding:12px}.add-row{flex-direction:column}.song-header{flex-wrap:wrap;gap:10px}.song-info{gap:10px}.rank{font-size:32px}.rating-control{width:100%;max-width:none;margin-left:0;justify-content:flex-start}.current-rating{text-align:left}.spotify{height:152px}}
    @media(prefers-color-scheme:dark){:root,body{background:#202020;color:#fff}.song,.dialog{background:#292929;color:#fff;border-color:#555}.add-row input,.secondary{background:#333;color:#fff;border-color:#777}.track-meta,.current-rating,.empty{color:#c8c6c4}.star{color:#aaa}.rank-other{color:#c8c6c4}}
  </style>
</head>
<body>
<main>
  <h1>Song Of The Day</h1>
  <div class="add-row"><input id="url" type="url" autocomplete="off" aria-label="Enlace de Spotify"><button id="add" class="primary">Agregar canción</button></div>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="list" aria-label="Canciones del día"></section>
</main>
<div id="confirm" class="dialog-backdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">¿Reemplazar tu canción?</h2>
    <p>Ya agregaste una canción hoy. Si continúas, tu canción actual y sus puntuaciones serán reemplazadas.</p>
    <div class="dialog-actions"><button id="cancel" class="secondary">Cancelar</button><button id="replace" class="primary">Reemplazar</button></div>
  </div>
</div>
<script>
const songsApi='/api/songs',ratingsApi='/api/ratings';
let me={id:'',name:''},pending=null,songs=[],aggregates=new Map(),loading=false;
const names=new Map(Object.entries({vespinozaval:'Mikkely Espinoza',miguelgarcia:'Mike Garcia',griselflores:'Grisel Flores',dgonzalezrob:'David Gonzalez',nicolemunoz:'Nicole Muñoz',rodgarcia:'Rodrigo Garcia',carloslopez:'Carlos Lopez',juanperez:'Juan Perez'}));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function friendlyName(value){const raw=String(value??'').trim(),local=raw.replace(/@microsoft\.com$/i,'').split('@')[0],key=local.toLowerCase();return names.get(key)||[...names.values()].find(n=>n.toLowerCase()===key)||local}
function spotifyId(value){try{const u=new URL(value.trim()),m=u.hostname==='open.spotify.com'&&u.pathname.match(/^\/(?:intl-[a-z-]+\/)?track\/([A-Za-z0-9]{22})/);return m&&m[1]}catch{return null}}
function aggregateKey(x){return x.songOwnerId+'|'+x.trackId}
function reviewText(a){if(!a||!a.reviewCount)return 'No reviews';return `${Number(a.averageRating).toFixed(1)} · ${a.reviewCount} ${a.reviewCount===1?'review':'reviews'}`}
function filledStars(a){const count=a&&a.reviewCount?Math.round(Number(a.averageRating)):0;return '★'.repeat(count)+'☆'.repeat(5-count)}
function currentText(a){const r=a?.currentUserRating;if(!r)return '';return r.ratingType==='stars'?`Tu puntuación: ${r.ratingValue} ${r.ratingValue===1?'estrella':'estrellas'}`:`Tu puntuación: ${r.ratingValue} de 8 puntos`}
function sortedSongs(){return [...songs].sort((a,b)=>{const x=aggregates.get(aggregateKey(a))||{averageRating:0,reviewCount:0},y=aggregates.get(aggregateKey(b))||{averageRating:0,reviewCount:0};if(Boolean(x.reviewCount)!==Boolean(y.reviewCount))return x.reviewCount?-1:1;if(y.averageRating!==x.averageRating)return y.averageRating-x.averageRating;if(y.reviewCount!==x.reviewCount)return y.reviewCount-x.reviewCount;return String(a.createdUtc).localeCompare(String(b.createdUtc))})}
function rankClass(rank){return rank>=1&&rank<=8?`rank-${rank}`:'rank-other'}
function headerHtml(song,rank,a){const title=song.trackTitle||'Canción',artists=song.artistName?` · ${esc(song.artistName)}`:'';return `<div class="song-info"><span class="rank ${rankClass(rank)}" aria-label="Posición ${rank}">${rank}</span><div><div class="owner">Song of ${esc(friendlyName(song.userName))}</div><div class="track-meta">${esc(title)}${artists}</div></div></div><div class="rating-control"><div class="stars" role="group" aria-label="Puntuación con estrellas">${[1,2,3,4,5].map(v=>`<button type="button" class="star ${v<=Math.round(a.averageRating||0)?'filled':''}" data-stars="${v}" aria-label="Calificar con ${v} ${v===1?'estrella':'estrellas'}">${v<=Math.round(a.averageRating||0)?'★':'☆'}</button>`).join('')}</div><span class="summary" aria-label="Promedio ${reviewText(a)}">${filledStars(a)} (${reviewText(a)})</span><span class="current-rating">${esc(currentText(a))}</span></div>`}
function wireRating(header,song,a){header.querySelectorAll('[data-stars]').forEach(button=>button.onclick=()=>rate(song,'stars',Number(button.dataset.stars),a))}
function render(){const list=document.querySelector('#list'),ordered=sortedSongs(),keys=new Set(ordered.map(x=>aggregateKey(x)));for(const node of [...list.children])if(node.classList.contains('song')&&!keys.has(node.dataset.key))node.remove();const empty=list.querySelector('.empty');if(empty)empty.remove();if(!ordered.length){list.innerHTML='<div class="empty">No hay canciones todavía.</div>';return}ordered.forEach((song,index)=>{const key=aggregateKey(song),a=aggregates.get(key)||{averageRating:0,reviewCount:0};let node=[...list.children].find(n=>n.dataset.key===key);if(!node){node=document.createElement('article');node.className='song';node.dataset.key=key;node.innerHTML='<header class="song-header"></header><iframe class="spotify" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="Spotify"></iframe>';node.querySelector('iframe').src=`https://open.spotify.com/embed/track/${encodeURIComponent(song.trackId)}?utm_source=generator`}const header=node.querySelector('.song-header');header.innerHTML=headerHtml(song,index+1,a);wireRating(header,song,a);list.appendChild(node)})}
async function identity(){try{await microsoftTeams.app.initialize();const c=await microsoftTeams.app.getContext();me.id=String(c.user?.id||c.user?.loginHint||'').trim();me.name=String(c.user?.displayName||friendlyName(c.user?.loginHint)||'').trim()}catch(e){document.querySelector('#status').textContent='Abre SOTD en Microsoft Teams para identificar tu usuario.'}}
async function load(){if(loading)return;loading=true;try{const query=me.id?`?reviewerUserId=${encodeURIComponent(me.id)}`:'';const [sr,rr]=await Promise.all([fetch(songsApi,{cache:'no-store'}),fetch(ratingsApi+query,{cache:'no-store'})]);if(!sr.ok||!rr.ok)return;const [sd,rd]=await Promise.all([sr.json(),rr.json()]);songs=sd.items||[];aggregates=new Map((rd.items||[]).map(x=>[aggregateKey(x),x]));render()}catch(e){document.querySelector('#status').textContent='No se pudo actualizar la lista.'}finally{loading=false}}
async function submitSong(trackId,replace){return fetch(songsApi,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({trackId,userId:me.id,userName:me.name,replace})})}
async function add(){const trackId=spotifyId(document.querySelector('#url').value),status=document.querySelector('#status');if(!trackId){status.textContent='Pega un enlace válido de una canción de Spotify.';return}if(!me.id||!me.name){status.textContent='No se pudo identificar tu usuario de Teams.';return}status.textContent='';document.querySelector('#add').disabled=true;try{const response=await submitSong(trackId,false),data=await response.json();if(response.status===409&&data.code==='ALREADY_SUBMITTED'){pending=trackId;document.querySelector('#confirm').hidden=false;document.querySelector('#replace').focus();return}if(!response.ok){status.textContent=data.error||'No se pudo agregar la canción.';return}document.querySelector('#url').value='';await load()}finally{document.querySelector('#add').disabled=false}}
function closeConfirm(){pending=null;document.querySelector('#confirm').hidden=true}
async function replaceSong(){const trackId=pending;closeConfirm();if(!trackId)return;const status=document.querySelector('#status');const response=await submitSong(trackId,true),data=await response.json();if(!response.ok){status.textContent=data.error||'No se pudo reemplazar la canción.';return}document.querySelector('#url').value='';await load()}
async function rate(song,ratingType,ratingValue,current){const existing=current?.currentUserRating;if(existing&&existing.ratingType===ratingType&&Number(existing.ratingValue)===ratingValue)return;const status=document.querySelector('#status');if(!me.id||!me.name){status.textContent='No se pudo identificar tu usuario de Teams.';return}try{const response=await fetch(ratingsApi,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({trackId:song.trackId,songOwnerId:song.songOwnerId,reviewerUserId:me.id,reviewerUserName:me.name,ratingType,ratingValue})}),data=await response.json();if(!response.ok){status.textContent=data.error||'No se pudo guardar la puntuación.';return}aggregates.set(aggregateKey(song),data);status.textContent='';render()}catch(e){status.textContent='No se pudo guardar la puntuación.'}}
document.querySelector('#add').onclick=add;document.querySelector('#url').addEventListener('keydown',e=>{if(e.key==='Enter')add()});document.querySelector('#cancel').onclick=closeConfirm;document.querySelector('#replace').onclick=replaceSong;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#confirm').hidden)closeConfirm()});
(async()=>{await identity();await load();setInterval(load,30000)})();
</script>
</body>
</html>
